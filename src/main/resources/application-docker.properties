# ===== Perfil docker: stack completo (Postgres + Redis + RabbitMQ + WireMock) =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:logistpulse}
spring.datasource.username=${DB_USER:logistpulse}
spring.datasource.password=${DB_PASSWORD:logistpulse}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

lab.messaging.enabled=true
lab.carrier.base-url=${CARRIER_URL:http://carrier-mock:8080}

management.health.redis.enabled=true
management.health.rabbit.enabled=true

# El publicador del outbox espera la confirmación (ack) del broker antes de marcar el evento como enviado
spring.rabbitmq.publisher-confirm-type=simple
lab.messaging.consumer-enabled=${LAB_MESSAGING_CONSUMER_ENABLED:true}

# Parte 8.3: con Redis/RabbitMQ caidos las llamadas esperaban ~58 s (timeout por defecto de Lettuce: 60 s); ahora fallan en <1 s
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.rabbitmq.connection-timeout=2s
