# ===== Modo LITE (por defecto): H2 en memoria, sin Redis ni RabbitMQ =====
spring.application.name=logistpulse-lab
server.port=8080

# Jersey en la raíz: la API vive en /api/** y Actuator en /actuator/**
spring.jersey.application-path=/

# Datos
spring.datasource.url=jdbc:h2:mem:logistpulse;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Cache local, sin Redis
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# Mensajería desactivada: el evento solo se escribe en el log
lab.messaging.enabled=false

# Transportista externo (WireMock). Puedes levantar solo ese contenedor: docker compose up carrier-mock
lab.carrier.base-url=${CARRIER_URL:http://localhost:9091}

# Rutas: false = 4 vecinos (Manhattan); true = 8 vecinos con diagonales de costo raiz(2) (octil)
lab.route.diagonal=false

# Observabilidad
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.metrics.tags.application=logistpulse-lab

# Transportista: reintentos solo ante 5xx (máx. 2, backoff exponencial 200 ms, 400 ms)
lab.carrier.max-retries=2
lab.carrier.retry-backoff-ms=200

# Outbox: cada cuánto se revisan los eventos pendientes y tamaño del lote
lab.outbox.poll-ms=1000
lab.outbox.batch-size=50

# false = el consumidor de RabbitMQ no arranca (para observar cómo se acumula la cola)
lab.messaging.consumer-enabled=true

# Parte 8.4: histograma de latencia (buckets) para calcular p95 con histogram_quantile en Prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Parte 8.6: el gauge logistpulse.orders.by.status reutiliza la última lectura durante estos ms (evita una consulta por scrape)
lab.metrics.orders-cache-ms=3000

# Parte 8.3: fallar rapido cuando la BD no responde (por defecto la pool esperaba 30 s antes de lanzar el error)
spring.datasource.hikari.connection-timeout=2000
